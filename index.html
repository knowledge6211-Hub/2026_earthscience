<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地震與 AI 學習之旅</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: #e94560;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            transition: background 0.5s ease;
        }
        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 50px 40px;
            max-width: 650px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            z-index: 10;
            position: relative;
        }
        .container:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(233, 69, 96, 0.3);
        }
        h1 {
            color: #ffb830;
            margin-bottom: 25px;
            font-size: 2.2em;
            text-shadow: 0 0 15px rgba(255, 184, 48, 0.4);
            letter-spacing: 1px;
        }
        p {
            line-height: 1.8;
            font-size: 1.15em;
            color: #e0e0e0;
            text-align: justify;
            margin-bottom: 15px;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.8s forwards;
        }
        p:nth-child(2) { animation-delay: 0.2s; }
        p:nth-child(3) { animation-delay: 0.4s; }
        p:nth-child(4) { animation-delay: 0.6s; }
        p:nth-child(5) { animation-delay: 0.8s; }

        .highlight-eq { color: #ff6b6b; font-weight: bold; text-shadow: 0 0 8px rgba(255, 107, 107, 0.6); }
        .highlight-ai { color: #00d2d3; font-weight: bold; text-shadow: 0 0 8px rgba(0, 210, 211, 0.6); }

        .btn {
            background: linear-gradient(45deg, #ff512f, #dd2476);
            border: none;
            border-radius: 30px;
            color: white;
            padding: 15px 35px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            margin-top: 30px;
            box-shadow: 0 4px 15px rgba(221, 36, 118, 0.4);
            transition: all 0.3s ease;
            animation: fadeInUp 1s forwards;
            animation-delay: 1s;
            opacity: 0;
        }
        .btn:hover {
            box-shadow: 0 6px 25px rgba(221, 36, 118, 0.7);
            transform: scale(1.05);
        }

        /* Earthquake Animation */
        .shake {
            animation: eq-shake 0.4s cubic-bezier(.36,.07,.19,.97) both infinite;
            background: linear-gradient(135deg, #2a0800, #1a0000); /* Darker red background during EQ */
        }
        @keyframes eq-shake {
            10%, 90% { transform: translate3d(-3px, 0, 0) rotate(-1deg); }
            20%, 80% { transform: translate3d(4px, 0, 0) rotate(1deg); }
            30%, 50%, 70% { transform: translate3d(-10px, 0, 0) rotate(-2deg); }
            40%, 60% { transform: translate3d(10px, 0, 0) rotate(2deg); }
        }

        /* Fade in up animation */
        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Seismic background decoration */
        .seismic-line {
            position: absolute;
            bottom: 10%;
            left: 0;
            width: 100%;
            height: 50px;
            background: url('data:image/svg+xml;utf8,<svg viewBox="0 0 100 50" xmlns="http://www.w3.org/2000/svg"><polyline points="0,25 10,25 15,10 20,40 25,20 30,30 35,5 40,45 45,25 100,25" fill="none" stroke="%23ff6b6b" stroke-width="2" stroke-opacity="0.3"/></svg>') repeat-x;
            background-size: 100px 50px;
            animation: seismic-scroll 3s linear infinite;
            z-index: 0;
            opacity: 0.5;
        }
        @keyframes seismic-scroll {
            from { background-position-x: 0; }
            to { background-position-x: -100px; }
        }
    </style>
</head>
<body>

    <div class="seismic-line"></div>

    <div class="container" id="content-box">
        <h1>我的學習心得：<br>地震與 AI 的探索</h1>
        <p>這門課結合概念與實作，讓我更加瞭解<span class="highlight-eq">地震</span>，以及地震是如何發生的。</p>
        <p>我也學習使用 <span class="highlight-ai">AI</span> 幫助我分析一些地震資訊，讓學習變得更容易。</p>
        <p>在這門課之前，我對地震瞭解不多，上完這門課後，我更加瞭解地震和自然災害。</p>
        <p>總體來說，我學到了很多，我覺得這對我來說是一次很有用、也很有趣的學習經驗。</p>
        
        <button class="btn" onclick="toggleEarthquake()">觸發模擬地震 🌍</button>
    </div>

    <script>
        function toggleEarthquake() {
            const body = document.body;
            const btn = document.querySelector('.btn');
            const seismicLine = document.querySelector('.seismic-line');
            
            if (body.classList.contains('shake')) {
                // Stop earthquake
                body.classList.remove('shake');
                btn.innerHTML = "觸發模擬地震 🌍";
                btn.style.background = "linear-gradient(45deg, #ff512f, #dd2476)";
                seismicLine.style.animationDuration = "3s";
                seismicLine.style.opacity = "0.5";
                seismicLine.style.strokeOpacity = "0.3";
            } else {
                // Start earthquake
                body.classList.add('shake');
                btn.innerHTML = "停止地震 🛑";
                btn.style.background = "linear-gradient(45deg, #11998e, #38ef7d)";
                seismicLine.style.animationDuration = "0.5s"; // make the line move faster
                seismicLine.style.opacity = "1";
            }
        }
    </script>
</body>
</html>
